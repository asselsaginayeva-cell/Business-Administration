<style>
.top{display:grid;grid-template-columns:1fr 1.5fr;gap:48px;align-items:end;margin-bottom:34px}
.top h1{font-size:clamp(46px,7vw,88px);font-weight:400;letter-spacing:-.03em}
.top h1 em{color:var(--hazel)}
.panel{margin-top:30px;background:var(--card);border:1.5px solid var(--ink);border-radius:3px;position:relative;min-height:470px;
  box-shadow:6px 6px 0 var(--paper-2)}
.panel .tape{top:-12px;left:46px}
.pin{display:grid;grid-template-columns:150px 1fr;min-height:470px}
.side{border-right:1px dashed var(--line);padding:30px 22px;display:flex;flex-direction:column;justify-content:space-between}
.side .big{font:300 112px/0.8 var(--serif);font-variation-settings:"SOFT" 100;color:var(--cocoa)}
.nav{display:flex;gap:8px}
.nav button{width:40px;height:40px;border:1.5px solid var(--ink);background:var(--paper);border-radius:50%;cursor:pointer;font:16px var(--mono)}
.nav button:hover{background:var(--ink);color:var(--paper)}
.body{padding:30px 34px 30px}
.body h2{font-size:clamp(28px,3.2vw,40px);margin:10px 0 16px}
.facts{display:flex;gap:0;margin:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{flex:1;padding:12px 14px 12px 0}
.facts div+div{padding-left:14px;border-left:1px solid var(--line)}
.facts b{display:block;font:500 22px/1.1 var(--serif)}
.facts span{font-size:12.5px;color:var(--ink-3)}
.take{display:flex;gap:14px;align-items:flex-start;background:var(--paper);padding:14px 16px;border-radius:2px}
.take .hand{font-size:24px;white-space:nowrap;transform:rotate(-3deg)}
.files{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.fade{animation:fd .45s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.wrapped{display:flex;flex-direction:column;justify-content:center;height:100%;gap:14px}
.wrapped .hand{font-size:34px}
@media (max-width:760px){.top{grid-template-columns:1fr;gap:12px}.pin{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px dashed var(--line);flex-direction:row;align-items:end;padding:20px}.side .big{font-size:72px}.body{padding:22px 20px}.facts{flex-direction:column}.facts div+div{padding-left:0;border-left:0;border-top:1px solid var(--line)}}
</style>
<main>
  <div class="top">
    <h1>Weekly <em>records</em></h1>
    <p class="muted">Every week has the same shape: <b>concept</b> from the chapters, an <b>application</b> artifact from practice, what I <b>verified</b> and which AI I used, and a <b>transfer</b> verdict for Bayan Sulu. Pick a piece of the bar.</p>
  </div>
  <div class="bar" id="bar" role="toolbar" aria-label="Choose a week"></div>
  <div class="panel" aria-live="polite"><span class="tape"></span><div class="pin" id="pin"></div></div>
</main>
<script>
(function(){
  const W=window.WEEKS,L=window.LINKS||{},bar=document.getElementById('bar'),pin=document.getElementById('pin');let cur=0;const btns=[];
  const file=(f)=>L[f[1]]?'<a class="btn" target="_blank" rel="noopener" href="'+L[f[1]]+'">↗ '+f[0]+'</a>':'<span class="btn ghost">'+f[0]+' · link soon</span>';
  function render(i){
    cur=i;const w=W[i];btns.forEach((b,j)=>b.setAttribute('aria-pressed',j===i));
    let side='<div><div class="label">Week</div><div class="big">'+String(w.n).padStart(2,'0')+'</div></div><div class="nav"><button aria-label="Previous week" data-d="-1">←</button><button aria-label="Next week" data-d="1">→</button></div>';
    let body;
    if(w.status==='done'){
      body='<div class="label">'+w.topic+'</div><h2>'+w.title+'</h2><p>'+w.summary+'</p>'+
      '<div class="facts">'+w.facts.map(f=>'<div><b>'+f[0]+'</b><span>'+f[1]+'</span></div>').join('')+'</div>'+
      '<div class="take"><span class="hand">for Bayan Sulu →</span><p>'+w.takeaway+'</p></div>'+
      '<div class="label" style="margin-top:22px">Artifact: '+w.artifact+'</div><div class="files">'+w.files.map(file).join('')+'</div>';
    }else if(w.status==='wip'){
      body='<div class="wrapped"><div class="label">'+w.topic+'</div><h2>Half unwrapped.</h2><p>The Week 5 record — '+w.artifact.toLowerCase()+' and the supply-chain work behind my video essay — is being edited. It will appear here soon.</p><span class="hand">still adding the last details ✎</span></div>';
    }else{
      body='<div class="wrapped"><div class="label">Coming up</div><h2>'+w.topic+'</h2><p class="muted">This piece is still in its foil. The record will be added after the week\'s lecture and practice session.</p></div>';
    }
    pin.innerHTML='<div class="side">'+side+'</div><div class="body fade">'+body+'</div>';
    pin.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>render((cur+ +b.dataset.d+W.length)%W.length));
  }
  W.forEach((w,i)=>{
    const b=document.createElement('button');b.className='piece '+(w.status==='done'?'':w.status==='wip'?'wip':'foil');
    b.innerHTML='<span class="n">'+w.n+'</span><span class="t">'+w.short+'</span>';
    b.setAttribute('aria-label','Week '+w.n);b.onclick=()=>render(i);bar.appendChild(b);btns.push(b);
  });
  const m=/^#w(\d+)$/.exec(location.hash);render(m&&W[m[1]-1]?m[1]-1:3);
})();
</script>
